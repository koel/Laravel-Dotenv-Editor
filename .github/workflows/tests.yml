name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            illuminate: '^11'
            testbench: '^9.0'
            phpunit: '^11.5'
          - php: '8.2'
            illuminate: '^12'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.3'
            illuminate: '^13'
            testbench: '^11.0'
            phpunit: '^12.0'

    name: PHP ${{ matrix.php }} - Illuminate ${{ matrix.illuminate }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/console:${{ matrix.illuminate }}" "illuminate/contracts:${{ matrix.illuminate }}" "illuminate/support:${{ matrix.illuminate }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
